<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>Urban RP</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif;overflow:hidden}body{min-height:100vh;min-height:100dvh}button,input{font:inherit}.screen{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transform:translateY(8px);transition:opacity .35s,transform .35s}.screen.active{opacity:1;pointer-events:auto;transform:translateY(0)}#loadingScreen{justify-content:center}.loading-title{position:absolute;top:34px;left:0;right:0;text-align:center;font-size:30px;font-weight:800;letter-spacing:5px}.loading-wrap{display:flex;flex-direction:column;align-items:center;gap:22px}.loader{width:48px;height:48px;border:4px solid #241010;border-top-color:#e00000;border-right-color:#e00000;border-radius:50%;animation:spin .8s linear infinite}.loading-text{font-size:16px;letter-spacing:1px}@keyframes spin{to{transform:rotate(360deg)}}.game-title{margin-top:42px;font-size:30px;font-weight:800;letter-spacing:5px}.subtitle{margin:42px 0 22px;font-size:18px;font-weight:600}.server-list,.auth-content{width:min(92%,430px)}.server-list{display:flex;flex-direction:column;gap:13px}.server-card{width:100%;min-height:76px;padding:18px 20px;border:1px solid #292929;border-radius:14px;background:#0b0b0b;color:#fff;text-align:left;cursor:pointer;transition:.2s}.server-card:not(:disabled):active{transform:scale(.98);border-color:#e00000;background:#111}.server-card:disabled{opacity:.42;cursor:default}.server-name{font-size:17px;font-weight:750;letter-spacing:.5px}.server-status{margin-top:7px;color:#8c8c8c;font-size:12px}.auth-content{margin-top:58px}.auth-title{font-size:21px;font-weight:750;margin-bottom:10px}.auth-info{color:#777;font-size:13px;margin-bottom:24px}.field{width:100%;height:54px;margin-bottom:12px;padding:0 17px;border:1px solid #292929;outline:0;border-radius:12px;background:#0b0b0b;color:#fff;transition:border-color .2s}.field::placeholder{color:#666}.field:focus{border-color:#e00000}.red-button{width:100%;height:54px;margin-top:8px;border:0;border-radius:12px;background:#e00000;color:#fff;font-weight:750;cursor:pointer}.red-button:active{transform:scale(.98);background:#c80000}.error{min-height:18px;margin-top:12px;color:#ff4b4b;font-size:13px}#roomScreen{justify-content:center}.room-title{font-size:28px;font-weight:800;letter-spacing:4px}.room-subtitle{margin-top:12px;color:#777;font-size:14px}</style></head><body><section id="loadingScreen" class="screen active"><div class="loading-title">URBAN RP</div><div class="loading-wrap"><div class="loader"></div><div class="loading-text">Загрузка игры</div></div></section><section id="serverScreen" class="screen"><div class="game-title">URBAN RP</div><div class="subtitle">Выберите сервер</div><div class="server-list"><button class="server-card" id="server01"><div class="server-name">SERVER 01 — ВАЛЬГРАД</div><div class="server-status">Онлайн</div></button><button class="server-card" disabled><div class="server-name">SERVER 02</div><div class="server-status">Сервер в разработке</div></button></div></section><section id="nameScreen" class="screen"><div class="game-title">URBAN RP</div><div class="auth-content"><div class="auth-title">Создание персонажа</div><div class="auth-info">SERVER 01 — ВАЛЬГРАД</div><input id="firstName" class="field" placeholder="Введите имя" maxlength="20"><input id="lastName" class="field" placeholder="Введите фамилию" maxlength="25"><button id="continueButton" class="red-button">Продолжить</button><div id="nameError" class="error"></div></div></section><section id="passwordScreen" class="screen"><div class="game-title">URBAN RP</div><div class="auth-content"><div class="auth-title">Авторизация</div><div class="auth-info">Создайте пароль для входа</div><input id="password" class="field" type="password" placeholder="Введите пароль" maxlength="64"><input id="passwordRepeat" class="field" type="password" placeholder="Повторите пароль" maxlength="64"><button id="loginButton" class="red-button">Войти</button><div id="passwordError" class="error"></div></div></section><section id="roomScreen" class="screen"><div class="room-title">ВАЛЬГРАД</div><div class="room-subtitle">Добро пожаловать в Urban RP</div></section><script>const screens={loading:loadingScreen,server:serverScreen,name:nameScreen,password:passwordScreen,room:roomScreen};function showScreen(n){Object.values(screens).forEach(s=>s.classList.remove('active'));screens[n].classList.add('active')}setTimeout(()=>showScreen('server'),2200);server01.onclick=()=>showScreen('name');continueButton.onclick=()=>{if(!firstName.value.trim()||!lastName.value.trim()){nameError.textContent='Введите имя и фамилию';return}nameError.textContent='';showScreen('password');password.focus()};loginButton.onclick=()=>{if(password.value.length<4){passwordError.textContent='Пароль должен содержать минимум 4 символа';return}if(password.value!==passwordRepeat.value){passwordError.textContent='Пароли не совпадают';return}passwordError.textContent='';showScreen('room')};document.querySelectorAll('.field').forEach(i=>i.addEventListener('keydown',e=>{if(e.key==='Enter')(i.id==='firstName'||i.id==='lastName'?continueButton:loginButton).click()}));</script></body></html>

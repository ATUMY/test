<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Black Russia Prototype — 3D Open World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #87CEEB; font-family: Arial, sans-serif; }
  canvas { display: block; }

  /* Джойстик */
  #joystick {
    position: fixed; left: 30px; bottom: 30px;
    width: 140px; height: 140px; border-radius: 50%;
    background: rgba(255,255,255,0.25);
    border: 2px solid rgba(255,255,255,0.5);
    touch-action: none; user-select: none; z-index: 10;
  }
  #stick {
    position: absolute; left: 50%; top: 50%;
    width: 60px; height: 60px; margin-left: -30px; margin-top: -30px;
    border-radius: 50%; background: rgba(255,255,255,0.7);
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
    pointer-events: none;
  }

  /* HUD */
  #hud {
    position: fixed; top: 60px; left: 15px; color: #fff;
    text-shadow: 1px 1px 3px #000; font-size: 13px; z-index: 10; line-height: 1.5;
  }
  #hud b { color: #FFD700; }

  /* Чат сверху */
  #chat {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    width: min(500px, 90%); z-index: 20;
  }
  #chatLog {
    background: rgba(0,0,0,0.55); color: #fff; padding: 8px 12px;
    border-radius: 8px; font-size: 13px; max-height: 120px; overflow-y: auto;
    margin-bottom: 6px; line-height: 1.4;
  }
  #chatLog div { margin: 2px 0; }
  #chatLog .sys { color: #FFD700; }
  #chatLog .err { color: #ff7070; }
  #chatInput {
    width: 100%; padding: 8px 12px; border-radius: 8px; border: none;
    background: rgba(0,0,0,0.6); color: #fff; font-size: 14px; outline: none;
  }
  #chatInput::placeholder { color: #aaa; }

  /* Кнопка прыжка */
  #jumpBtn {
    position: fixed; right: 30px; bottom: 120px;
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(255,215,0,0.5);
    border: 2px solid rgba(255,255,255,0.7);
    color: #fff; font-size: 14px; font-weight: bold;
    text-shadow: 1px 1px 2px #000;
    touch-action: none; user-select: none; z-index: 10; cursor: pointer;
  }
  #jumpBtn:active { background: rgba(255,215,0,0.9); }

  /* Кнопка взаимодействия E */
  #actionBtn {
    position: fixed; right: 130px; bottom: 40px;
    width: 90px; height: 90px; border-radius: 50%;
    background: rgba(80,200,120,0.7);
    border: 2px solid rgba(255,255,255,0.8);
    color: #fff; font-size: 13px; font-weight: bold;
    text-shadow: 1px 1px 2px #000;
    touch-action: none; user-select: none; z-index: 10; cursor: pointer;
    display: none;
  }
  #actionBtn:active { background: rgba(80,200,120,1); }

  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #fff; font-size: 20px; text-shadow: 2px 2px 4px #000; z-index: 30;
  }
</style>
</head>
<body>

<div id="loading">Загрузка мира...</div>

<div id="chat">
  <div id="chatLog">
    <div class="sys">Добро пожаловать! Введите /help для списка команд.</div>
  </div>
  <input id="chatInput" type="text" placeholder="Нажмите здесь, чтобы писать в чат..." autocomplete="off" />
</div>

<div id="hud">
  💰 Рубли: <b id="money">0</b><br>
  🏃 Скорость: <b id="speed">0</b> км/ч<br>
  📍 Координаты: <b id="coords">0, 0</b><br>
  🎮 Режим: <b id="mode">Пешком</b>
</div>

<div id="joystick"><div id="stick"></div></div>
<button id="jumpBtn">JUMP</button>
<button id="actionBtn">E</button>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ================== СЦЕНА ==================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB);
scene.fog = new THREE.Fog(0x87CEEB, 60, 200);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

// ================== СВЕТ ==================
const sun = new THREE.DirectionalLight(0xffffff, 1.2);
sun.position.set(50, 80, 30);
sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
sun.shadow.camera.top = 120; sun.shadow.camera.bottom = -120;
scene.add(sun);
scene.add(new THREE.AmbientLight(0x88aaff, 0.6));

// ================== ЗЕМЛЯ ==================
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshLambertMaterial({ color: 0x3B8C3B })
);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Дороги
const roadMat = new THREE.MeshLambertMaterial({ color: 0x555555 });
const r1 = new THREE.Mesh(new THREE.PlaneGeometry(8, 400), roadMat);
r1.rotation.x = -Math.PI/2; r1.position.y = 0.01;
scene.add(r1);
const r2 = new THREE.Mesh(new THREE.PlaneGeometry(400, 8), roadMat);
r2.rotation.x = -Math.PI/2; r2.position.y = 0.01;
scene.add(r2);

// ================== ДОМА ==================
const buildingColors = [0xcc4444, 0x4444cc, 0xcccc44, 0xcccccc, 0x884422];
function spawnBuilding(x, z) {
  const w = 8, h = 4 + Math.random()*12, d = 8;
  const color = buildingColors[Math.floor(Math.random()*buildingColors.length)];
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshLambertMaterial({ color }));
  b.position.set(x, h/2, z);
  b.castShadow = true; b.receiveShadow = true;
  scene.add(b);
}
for (let x=-80; x<=80; x+=30) {
  for (let z=-80; z<=80; z+=30) {
    if (Math.abs(x)<15 || Math.abs(z)<15) continue;
    spawnBuilding(x + (Math.random()-0.5)*6, z + (Math.random()-0.5)*6);
  }
}

// ================== ДЕРЕВЬЯ ==================
function spawnTree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.3,0.4,2.5,6),
    new THREE.MeshLambertMaterial({ color: 0x6b4423 })
  );
  trunk.position.set(x,1.25,z); trunk.castShadow = true;
  scene.add(trunk);
  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(1.8,8,8),
    new THREE.MeshLambertMaterial({ color: 0x2d6b2d })
  );
  leaves.position.set(x,3.5,z); leaves.castShadow = true;
  scene.add(leaves);
}
for (let i=0;i<40;i++){
  const x=(Math.random()-0.5)*180, z=(Math.random()-0.5)*180;
  if (Math.abs(x)<10 || Math.abs(z)<10) continue;
  spawnTree(x,z);
}

// ================== ПЕРСОНАЖ ==================
const player = new THREE.Group();
const body = new THREE.Mesh(
  new THREE.CapsuleGeometry(0.4,0.8,4,8),
  new THREE.MeshLambertMaterial({ color: 0x2244aa })
);
body.position.y = 1.0; body.castShadow = true; player.add(body);
const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.35,16,16),
  new THREE.MeshLambertMaterial({ color: 0xffcc99 })
);
head.position.y = 1.85; head.castShadow = true; player.add(head);
scene.add(player);

// ================== ФИЗИКА ==================
const GRAVITY = -25;
const MOVE_SPEED = 8;
const JUMP_FORCE = 10;
const state = {
  velocityY: 0, onGround: true, speed: 0, money: 0,
  mode: 'foot' // 'foot' | 'car'
};

// ================== КАМЕРА-ОРБИТА ==================
const cameraOrbit = {
  yaw: 0,           // горизонтальный угол
  pitch: 0.35,      // вертикальный угол
  distance: 10,
  minPitch: -0.2,
  maxPitch: 1.2
};
const cameraTarget = new THREE.Vector3();
const desiredCameraPos = new THREE.Vector3();

function updateCamera(dt) {
  cameraTarget.copy(player.position);
  cameraTarget.y += 2;

  const offsetX = Math.sin(cameraOrbit.yaw) * Math.cos(cameraOrbit.pitch) * cameraOrbit.distance;
  const offsetZ = Math.cos(cameraOrbit.yaw) * Math.cos(cameraOrbit.pitch) * cameraOrbit.distance;
  const offsetY = Math.sin(cameraOrbit.pitch) * cameraOrbit.distance;

  desiredCameraPos.set(
    cameraTarget.x + offsetX,
    cameraTarget.y + offsetY,
    cameraTarget.z + offsetZ
  );
  camera.position.lerp(desiredCameraPos, Math.min(1, dt * 6));
  camera.lookAt(cameraTarget);
}

// ================== УПРАВЛЕНИЕ ДЖОЙСТИКОМ ==================
const joystickEl = document.getElementById('joystick');
const stickEl = document.getElementById('stick');
const joystickInput = { x: 0, y: 0 };
let joystickActive = false;
const joystickCenter = { x: 0, y: 0 };
const MAX_RADIUS = 50;

joystickEl.addEventListener('touchstart', e => {
  e.preventDefault();
  joystickActive = true;
  const rect = joystickEl.getBoundingClientRect();
  joystickCenter.x = rect.left + rect.width/2;
  joystickCenter.y = rect.top + rect.height/2;
  moveJoystick(e.touches[0]);
}, { passive: false });
joystickEl.addEventListener('touchmove', e => {
  e.preventDefault();
  if (joystickActive) moveJoystick(e.touches[0]);
}, { passive: false });
joystickEl.addEventListener('touchend', () => {
  joystickActive = false;
  stickEl.style.transform = 'translate(0,0)';
  joystickInput.x = 0; joystickInput.y = 0;
});
joystickEl.addEventListener('mousedown', e => {
  joystickActive = true;
  const rect = joystickEl.getBoundingClientRect();
  joystickCenter.x = rect.left + rect.width/2;
  joystickCenter.y = rect.top + rect.height/2;
  moveJoystick(e);
});
window.addEventListener('mousemove', e => { if (joystickActive) moveJoystick(e); });
window.addEventListener('mouseup', () => {
  if (joystickActive) {
    joystickActive = false;
    stickEl.style.transform = 'translate(0,0)';
    joystickInput.x = 0; joystickInput.y = 0;
  }
});

function moveJoystick(touch) {
  let dx = touch.clientX - joystickCenter.x;
  let dy = touch.clientY - joystickCenter.y;
  const dist = Math.hypot(dx, dy);
  if (dist > MAX_RADIUS) { dx = dx/dist*MAX_RADIUS; dy = dy/dist*MAX_RADIUS; }
  stickEl.style.transform = `translate(${dx}px,${dy}px)`;
  joystickInput.x = dx / MAX_RADIUS;
  joystickInput.y = -dy / MAX_RADIUS;
}

// ================== ПОВОРОТ КАМЕРЫ ПАЛЬЦЕМ ==================
let lookActive = false;
let lookPrev = { x: 0, y: 0 };
const LOOK_SENS = 0.005;

renderer.domElement.addEventListener('touchstart', e => {
  // Игнор, если касание началось на UI (джойстик/кнопки перехватят сами)
  if (e.touches.length === 1) {
    lookActive = true;
    lookPrev.x = e.touches[0].clientX;
    lookPrev.y = e.touches[0].clientY;
  }
}, { passive: true });

renderer.domElement.addEventListener('touchmove', e => {
  if (!lookActive || e.touches.length !== 1) return;
  const t = e.touches[0];
  const dx = t.clientX - lookPrev.x;
  const dy = t.clientY - lookPrev.y;
  cameraOrbit.yaw -= dx * LOOK_SENS;
  cameraOrbit.pitch += dy * LOOK_SENS;
  cameraOrbit.pitch = Math.max(cameraOrbit.minPitch, Math.min(cameraOrbit.maxPitch, cameraOrbit.pitch));
  lookPrev.x = t.clientX;
  lookPrev.y = t.clientY;
}, { passive: true });

renderer.domElement.addEventListener('touchend', () => { lookActive = false; });

// Мышка (ПК) — перетаскивание для поворота камеры
let mouseLook = false;
renderer.domElement.addEventListener('mousedown', e => {
  mouseLook = true; lookPrev.x = e.clientX; lookPrev.y = e.clientY;
});
window.addEventListener('mousemove', e => {
  if (!mouseLook) return;
  const dx = e.clientX - lookPrev.x;
  const dy = e.clientY - lookPrev.y;
  cameraOrbit.yaw -= dx * LOOK_SENS;
  cameraOrbit.pitch += dy * LOOK_SENS;
  cameraOrbit.pitch = Math.max(cameraOrbit.minPitch, Math.min(cameraOrbit.maxPitch, cameraOrbit.pitch));
  lookPrev.x = e.clientX; lookPrev.y = e.clientY;
});
window.addEventListener('mouseup', () => { mouseLook = false; });

// ================== КЛАВИАТУРА ==================
const keys = {};
window.addEventListener('keydown', e => {
  // Не перехватываем, если пишем в чат
  if (document.activeElement === chatInput) return;
  keys[e.key.toLowerCase()] = true;
  if (e.code === 'Space') tryJump();
  if (e.key.toLowerCase() === 'e') tryInteract();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

// ================== ПРЫЖОК ==================
function tryJump() {
  if (state.mode === 'car') return; // в машине не прыгаем
  if (state.onGround) {
    state.velocityY = JUMP_FORCE;
    state.onGround = false;
  }
}
document.getElementById('jumpBtn').addEventListener('click', tryJump);
document.getElementById('jumpBtn').addEventListener('touchstart', e => { e.preventDefault(); tryJump(); }, { passive: false });

// ================== МАШИНА ==================
let car = null;
const carState = { speed: 0, maxSpeed: 22, accel: 14, friction: 6, turnSpeed: 2.2 };
const CAR_INTERACT_DISTANCE = 6;

function spawnCar() {
  if (car) {
    // Переместить рядом с игроком
    const angle = player.rotation.y;
    car.position.set(
      player.position.x + Math.sin(angle) * 4,
      0.6,
      player.position.z + Math.cos(angle) * 4
    );
    car.rotation.y = angle;
    log('Машина перемещена рядом с вами', 'sys');
    return;
  }

  car = new THREE.Group();

  // Кузов
  const bodyMesh = new THREE.Mesh(
    new THREE.BoxGeometry(2.2, 0.8, 4.4),
    new THREE.MeshLambertMaterial({ color: 0xdd2222 })
  );
  bodyMesh.position.y = 0.4;
  bodyMesh.castShadow = true;
  car.add(bodyMesh);

  // Кабина
  const cabin = new THREE.Mesh(
    new THREE.BoxGeometry(1.9, 0.7, 2.0),
    new THREE.MeshLambertMaterial({ color: 0x222222 })
  );
  cabin.position.set(0, 1.1, -0.2);
  cabin.castShadow = true;
  car.add(cabin);

  // Колёса
  const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 12);
  const wheelPos = [
    [1.1, 0.4, 1.4], [-1.1, 0.4, 1.4],
    [1.1, 0.4, -1.4], [-1.1, 0.4, -1.4]
  ];
  wheelPos.forEach(p => {
    const w = new THREE.Mesh(wheelGeo, wheelMat);
    w.rotation.z = Math.PI/2;
    w.position.set(p[0], p[1], p[2]);
    w.castShadow = true;
    car.add(w);
  });

  // Фары
  const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
  const lampGeo = new THREE.BoxGeometry(0.3, 0.2, 0.1);
  const l1 = new THREE.Mesh(lampGeo, lightMat); l1.position.set(0.7, 0.6, 2.2); car.add(l1);
  const l2 = new THREE.Mesh(lampGeo, lightMat); l2.position.set(-0.7, 0.6, 2.2); car.add(l2);

  const angle = player.rotation.y;
  car.position.set(
    player.position.x + Math.sin(angle) * 4,
    0,
    player.position.z + Math.cos(angle) * 4
  );
  car.rotation.y = angle;
  scene.add(car);

  log('Машина создана рядом с вами. Нажмите E, чтобы сесть.', 'sys');
}

// ================== ВЗАИМОДЕЙСТВИЕ ==================
const actionBtn = document.getElementById('actionBtn');

function distanceToCar() {
  if (!car) return Infinity;
  const dx = player.position.x - car.position.x;
  const dz = player.position.z - car.position.z;
  return Math.hypot(dx, dz);
}

function tryInteract() {
  if (!car) return;
  if (state.mode === 'foot' && distanceToCar() < CAR_INTERACT_DISTANCE) {
    state.mode = 'car';
    state.speed = 0;
    document.getElementById('mode').textContent = 'В машине';
    log('Вы сели в машину. Управление — джойстик, E — выйти.', 'sys');
  } else if (state.mode === 'car') {
    // Высадка: игрок выходит слева от машины
    state.mode = 'foot';
    const side = new THREE.Vector3(Math.cos(car.rotation.y), 0, -Math.sin(car.rotation.y));
    player.position.copy(car.position).addScaledVector(side, 3);
    player.position.y = 0;
    document.getElementById('mode').textContent = 'Пешком';
    log('Вы вышли из машины.', 'sys');
  }
}

actionBtn.addEventListener('click', tryInteract);
actionBtn.addEventListener('touchstart', e => { e.preventDefault(); tryInteract(); }, { passive: false });

// ================== ЧАТ ==================
const chatInput = document.getElementById('chatInput');
const chatLog = document.getElementById('chatLog');

function log(text, cls = '') {
  const div = document.createElement('div');
  if (cls) div.className = cls;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
  // Не даём чату разрастаться
  while (chatLog.children.length > 30) chatLog.removeChild(chatLog.firstChild);
}

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const cmd = chatInput.value.trim();
    chatInput.value = '';
    if (!cmd) return;
    log('> ' + cmd, '');
    handleCommand(cmd);
    chatInput.blur();
  }
});

function handleCommand(raw) {
  const cmd = raw.toLowerCase();
  if (cmd === '/help') {
    log('/car — создать машину рядом', 'sys');
    log('/help — список команд', 'sys');
    log('/money — показать баланс', 'sys');
  } else if (cmd === '/car') {
    spawnCar();
  } else if (cmd === '/money') {
    log(`Ваш баланс: ${state.money} руб.`, 'sys');
  } else {
    log('Неизвестная команда. Попробуйте /help', 'err');
  }
}

// ================== ИГРОВОЙ ЦИКЛ ==================
const clock = new THREE.Clock();
const hudMoney = document.getElementById('money');
const hudSpeed = document.getElementById('speed');
const hudCoords = document.getElementById('coords');
let moneyTimer = 0;

function updatePlayer(dt, inX, inY) {
  // Направление относительно камеры (yaw)
  const camYaw = cameraOrbit.yaw;
  const forward = new THREE.Vector3(-Math.sin(camYaw), 0, -Math.cos(camYaw));
  const right = new THREE.Vector3(Math.cos(camYaw), 0, -Math.sin(camYaw));

  const moveDir = new THREE.Vector3()
    .addScaledVector(forward, inY)
    .addScaledVector(right, inX);

  if (moveDir.length() > 0.05) {
    moveDir.normalize();
    player.position.addScaledVector(moveDir, MOVE_SPEED * dt);
    const targetAngle = Math.atan2(moveDir.x, moveDir.z);
    let diff = targetAngle - player.rotation.y;
    while (diff > Math.PI) diff -= Math.PI*2;
    while (diff < -Math.PI) diff += Math.PI*2;
    player.rotation.y += diff * Math.min(1, dt*12);
    state.speed = MOVE_SPEED;
  } else {
    state.speed = 0;
  }

  // Гравитация + прыжок
  state.velocityY += GRAVITY * dt;
  player.position.y += state.velocityY * dt;
  if (player.position.y <= 0) {
    player.position.y = 0;
    state.velocityY = 0;
    state.onGround = true;
  }

  // Ограничение карты
  player.position.x = Math.max(-190, Math.min(190, player.position.x));
  player.position.z = Math.max(-190, Math.min(190, player.position.z));
}

function updateCar(dt, inX, inY) {
  if (!car) return;

  // Разгон/торможение
  if (inY > 0.1) {
    carState.speed += carState.accel * dt * inY;
  } else if (inY < -0.1) {
    carState.speed += carState.accel * dt * inY * 1.5;
  } else {
    // Трение
    if (carState.speed > 0) carState.speed = Math.max(0, carState.speed - carState.friction * dt);
    else if (carState.speed < 0) carState.speed = Math.min(0, carState.speed + carState.friction * dt);
  }
  carState.speed = Math.max(-carState.maxSpeed*0.5, Math.min(carState.maxSpeed, carState.speed));

  // Поворот — только когда есть скорость
  if (Math.abs(carState.speed) > 0.5) {
    const turnDir = -inX * Math.sign(carState.speed);
    car.rotation.y += turnDir * carState.turnSpeed * dt * (Math.abs(carState.speed) / carState.maxSpeed);
  }

  // Движение вперёд
  const forward = new THREE.Vector3(Math.sin(car.rotation.y), 0, Math.cos(car.rotation.y));
  car.position.addScaledVector(forward, carState.speed * dt);

  // Ограничение
  car.position.x = Math.max(-190, Math.min(190, car.position.x));
  car.position.z = Math.max(-190, Math.min(190, car.position.z));

  // Игрок внутри машины
  player.position.set(car.position.x, car.position.y + 0.5, car.position.z);
  player.rotation.y = car.rotation.y;

  state.speed = Math.abs(carState.speed);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.1);

  // Ввод: джойстик + клавиатура
  let inX = joystickInput.x;
  let inY = joystickInput.y;
  if (document.activeElement !== chatInput) {
    if (keys['w'] || keys['arrowup']) inY = 1;
    if (keys['s'] || keys['arrowdown']) inY = -1;
    if (keys['a'] || keys['arrowleft']) inX = -1;
    if (keys['d'] || keys['arrowright']) inX = 1;
  }

  if (state.mode === 'foot') {
    updatePlayer(dt, inX, inY);
  } else {
    updateCar(dt, inX, inY);
  }

  // Камера
  updateCamera(dt);

  // Экономика: +1 рубль за 0.5 сек ходьбы/езды
  if (state.speed > 0.1) {
    moneyTimer += dt;
    if (moneyTimer >= 0.5) {
      moneyTimer = 0;
      state.money += state.mode === 'car' ? 3 : 1;
      hudMoney.textContent = state.money;
    }
  }

  // Кнопка взаимодействия
  if (car) {
    if (state.mode === 'car') {
      actionBtn.style.display = 'block';
      actionBtn.textContent = 'ВЫЙТИ';
    } else if (distanceToCar() < CAR_INTERACT_DISTANCE) {
      actionBtn.style.display = 'block';
      actionBtn.textContent = 'СЕСТЬ';
    } else {
      actionBtn.style.display = 'none';
    }
  } else {
    actionBtn.style.display = 'none';
  }

  // HUD
  hudSpeed.textContent = (state.speed * 3.6).toFixed(0);
  hudCoords.textContent = `${player.position.x.toFixed(0)}, ${player.position.z.toFixed(0)}`;

  renderer.render(scene, camera);
}

// ================== РЕСАЙЗ ==================
window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Старт
document.getElementById('loading').style.display = 'none';
animate();
</script>
</body>
</html>

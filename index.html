/* ============================================================
   ГЕОМЕТРИЯ И УТИЛИТЫ
   ============================================================ */

function dist(a, b) {
  return Math.hypot(b.x - a.x, b.y - a.y);
}

// Предрасчёт: для каждого маршрута — сегменты с длинами и общая длина
function buildSegments(points) {
  const segs = [];
  let total = 0;
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    const len = dist(a, b);
    if (len > 0.0001) {
      segs.push({ a, b, len, start: total });
      total += len;
    }
  }
  return { segs, total };
}

// Позиция и направление на маршруте по пройденной дистанции s (с зацикливанием)
function sampleRoute(route, s) {
  const { segs, total } = route._geom;
  if (total === 0) return { x: route.points[0].x, y: route.points[0].y, dx: 1, dy: 0 };
  let t = s % total;
  if (t < 0) t += total;

  // бинарный поиск сегмента
  let lo = 0, hi = segs.length - 1;
  while (lo < hi) {
    const mid = (lo + hi + 1) >> 1;
    if (segs[mid].start <= t) lo = mid; else hi = mid - 1;
  }
  const seg = segs[lo];
  const local = (t - seg.start) / seg.len;
  const x = seg.a.x + (seg.b.x - seg.a.x) * local;
  const y = seg.a.y + (seg.b.y - seg.a.y) * local;
  const dx = (seg.b.x - seg.a.x) / seg.len;
  const dy = (seg.b.y - seg.a.y) / seg.len;
  return { x, y, dx, dy };
}

/* ============================================================
   ЦВЕТА МАШИНОК
   ============================================================ */
const CAR_COLORS = [
  "#ff4d4d", "#ffa64d", "#ffe64d", "#a6ff4d",
  "#4dff88", "#4dd2ff", "#4d88ff", "#a64dff",
  "#ff4dd2", "#ff66b3", "#66ffcc", "#ffcc66",
  "#c0c0ff", "#80ff80", "#ff8080", "#80ffff"
];

/* ============================================================
   КЛАСС МАШИНКИ
   ============================================================ */
class Car {
  constructor(route, speed, laneOffset = 0) {
    this.route = route;
    this.speed = speed;            // пикс/сек
    this.s = Math.random() * route._geom.total; // стартовая позиция
    this.laneOffset = laneOffset;  // смещение от осевой линии
    this.color = CAR_COLORS[(Math.random() * CAR_COLORS.length) | 0];

    // Размер машинки не больше ширины дороги
    const roadW = route.width;
    this.size = Math.max(3, roadW * 0.75); // квадратик
    // Длина чуть больше для эффекта движения
    this.length = this.size * 1.6;
  }

  update(dt) {
    this.s += this.speed * dt;
  }

  draw(ctx) {
    const p = sampleRoute(this.route, this.s);
    const angle = Math.atan2(p.dy, p.dx);

    // Смещение вбок (для второй полосы)
    const nx = -p.dy, ny = p.dx;
    const cx = p.x + nx * this.laneOffset;
    const cy = p.y + ny * this.laneOffset;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);

    // тень
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(-this.length / 2 + 1.2, -this.size / 2 + 1.2, this.length, this.size);

    // корпус
    ctx.fillStyle = this.color;
    ctx.fillRect(-this.length / 2, -this.size / 2, this.length, this.size);

    // «кабина» / блик
    ctx.fillStyle = "rgba(255,255,255,0.55)";
    ctx.fillRect(this.length / 2 - this.size * 0.6, -this.size * 0.25, this.size * 0.4, this.size * 0.5);

    ctx.restore();
  }
}

/* ============================================================
   ПРИЛОЖЕНИЕ
   ============================================================ */
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const app = document.getElementById("app");

// Только «настоящие» дороги: ширина >= 4 и не серые тонкие линии
const ROADS = MAP.routes.filter(r => r.width >= 4);

// Подготовка геометрии
ROADS.forEach(r => { r._geom = buildSegments(r.points); });

// Двустороннее движение: по каждой дороге едет N машин в двух направлениях
const cars = [];
const CARS_PER_ROAD = 3;

function spawnCars() {
  cars.length = 0;
  ROADS.forEach(route => {
    const total = route._geom.total;
    if (total < 20) return; // слишком короткая дорога — пропускаем

    const roadW = route.width;
    // Смещение полосы: ~25% от ширины дороги
    const lane = roadW * 0.25;

    const count = Math.min(CARS_PER_ROAD, Math.max(1, Math.floor(total / 150)));

    for (let i = 0; i < count; i++) {
      // Случайная скорость: кто-то быстро, кто-то медленно
      const speed = 25 + Math.random() * 95; // 25..120 пикс/сек

      // Прямое направление (смещение вправо от движения)
      cars.push(new Car(route, speed, +lane));

      // Обратное направление: отрицательная скорость и смещение в другую сторону
      if (Math.random() < 0.9) {
        const back = new Car(route, -speed * (0.6 + Math.random() * 0.6), -lane);
        cars.push(back);
      }
    }
  });

  document.getElementById("stat").textContent = `${cars.length} / ${ROADS.length}`;
}

/* ---------- Рендер карты ---------- */
function drawMap() {
  // Фон
  ctx.fillStyle = "#0e0e10";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Сетка (лёгкая)
  ctx.strokeStyle = "rgba(255,255,255,0.04)";
  ctx.lineWidth = 1 / view.scale;
  const gridStep = 100;
  const x0 = -view.panX / view.scale;
  const y0 = -view.panY / view.scale;
  const x1 = x0 + canvas.width / view.scale;
  const y1 = y0 + canvas.height / view.scale;
  ctx.beginPath();
  for (let x = Math.floor(x0 / gridStep) * gridStep; x < x1; x += gridStep) {
    ctx.moveTo(x, y0); ctx.lineTo(x, y1);
  }
  for (let y = Math.floor(y0 / gridStep) * gridStep; y < y1; y += gridStep) {
    ctx.moveTo(x0, y); ctx.lineTo(x1, y);
  }
  ctx.stroke();

  // Маленькие фигуры (здания)
  ctx.lineJoin = "round";
  for (const s of MAP.smallShapes) {
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x, s.y, s.width, s.height);
  }

  // Дороги
  for (const r of MAP.routes) {
    ctx.strokeStyle = r.color;
    ctx.lineWidth = r.width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (let i = 0; i < r.points.length; i++) {
      const p = r.points[i];
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();

    // Тонкая тёмная окантовка для объёма у широких дорог
    if (r.width >= 4) {
      ctx.strokeStyle = "rgba(0,0,0,0.35)";
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // Пунктирная осевая для широких дорог
  ctx.setLineDash([8, 10]);
  ctx.strokeStyle = "rgba(255,255,255,0.35)";
  ctx.lineWidth = 1;
  for (const r of MAP.routes) {
    if (r.width < 6) continue;
    ctx.beginPath();
    for (let i = 0; i < r.points.length; i++) {
      const p = r.points[i];
      if (i === 0) ctx.moveTo(p.x, p.y);
      else ctx.lineTo(p.x, p.y);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

/* ---------- Камера ---------- */
const view = {
  scale: MAP.scale * 1.6,
  panX: MAP.panX,
  panY: MAP.panY
};

function applyView() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.setTransform(view.scale, 0, 0, view.scale, view.panX, view.panY);
}

function fitView() {
  // Автоподбор: вписать все дороги в экран
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const r of MAP.routes) {
    for (const p of r.points) {
      if (p.x < minX) minX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.x > maxX) maxX = p.x;
      if (p.y > maxY) maxY = p.y;
    }
  }
  const pad = 60;
  const w = maxX - minX + pad * 2;
  const h = maxY - minY + pad * 2;
  const s = Math.min(canvas.width / w, canvas.height / h);
  view.scale = s;
  view.panX = (canvas.width - (minX + maxX) * s) / 2;
  view.panY = (canvas.height - (minY + maxY) * s) / 2;
}

/* ---------- Цикл ---------- */
let last = performance.now();
let paused = false;
let speedMul = 1;
const MAX_DT = 1 / 30; // защита от больших скачков

function frame(now) {
  const dt = Math.min((now - last) / 1000, MAX_DT);
  last = now;

  if (!paused) {
    const scaled = dt * speedMul;
    for (const car of cars) car.update(scaled);
  }

  applyView();
  drawMap();
  for (const car of cars) car.draw(ctx);

  requestAnimationFrame(frame);
}

/* ---------- Ресайз ---------- */
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(app.clientWidth * dpr);
  canvas.height = Math.floor(app.clientHeight * dpr);
  canvas.style.width = app.clientWidth + "px";
  canvas.style.height = app.clientHeight + "px";
  // пересчёт камеры
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  fitView();
}

/* ---------- Взаимодействие ---------- */
let dragging = false;
let dragStart = null;
let dragPanStart = null;

canvas.addEventListener("mousedown", e => {
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  dragPanStart = { x: view.panX, y: view.panY };
});
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  view.panX = dragPanStart.x + (e.clientX - dragStart.x);
  view.panY = dragPanStart.y + (e.clientY - dragStart.y);
});
window.addEventListener("mouseup", () => { dragging = false; });

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const worldX = (mx - view.panX) / view.scale;
  const worldY = (my - view.panY) / view.scale;
  const factor = Math.exp(-e.deltaY * 0.0015);
  view.scale *= factor;
  view.scale = Math.max(0.05, Math.min(6, view.scale));
  view.panX = mx - worldX * view.scale;
  view.panY = my - worldY * view.scale;
}, { passive: false });

// Кнопки
document.getElementById("btnPause").addEventListener("click", e => {
  paused = !paused;
  e.target.textContent = paused ? "▶ Пуск" : "⏸ Пауза";
});
document.getElementById("btnReset").addEventListener("click", () => {
  spawnCars();
});
document.getElementById("btnSpeed").addEventListener("click", e => {
  speedMul = speedMul === 1 ? 2 : speedMul === 2 ? 3 : 1;
  e.target.textContent = `⚡ x${speedMul}`;
});

/* ---------- Старт ---------- */
window.addEventListener("resize", resize);
resize();
spawnCars();
requestAnimationFrame(frame);
</script>

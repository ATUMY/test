AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAH/2Q=="};

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const buttonsEl = document.getElementById('destinations');

let dpr=1, W=0, H=0;
let view = {scale:1, x:0, y:0};
let car = {x:0,y:0,angle:0};
let route = [];
let routeIndex = 0;
let moving = false;
let animationId = 0;
let activeName = 'Вокзал';

const img = new Image();
img.src = MAP.backgroundDataUrl;

// ---------- graph ----------
const nodeById = new Map(MAP.routing.nodes.map(n=>[n.id,n]));
const roadById = new Map(MAP.roads.map(r=>[String(r.id),r]));
const poiByName = new Map(MAP.points.map(p=>[p.name,p]));

const graph = new Map();
function addNode(id,x,y){
  if(!graph.has(id)) graph.set(id,{id,x,y,edges:[]});
}
function addEdge(a,b,w){
  if(!graph.has(a)||!graph.has(b)) return;
  graph.get(a).edges.push({to:b,w});
}
for(const n of MAP.routing.nodes) addNode(n.id,n.x,n.y);
for(const e of MAP.routing.edges){
  addEdge(e.from,e.to,e.distance);
  if(e.bidirectional) addEdge(e.to,e.from,e.distance);
}

// Join road nodes that occupy exactly the same coordinate. This makes
// intersections shared by two separately drawn road objects traversable.
const coordNodes=new Map();
for(const n of MAP.routing.nodes){
  const key=n.x+'|'+n.y;
  if(!coordNodes.has(key)) coordNodes.set(key,[]);
  coordNodes.get(key).push(n.id);
}
for(const ids of coordNodes.values()){
  for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
    addEdge(ids[i],ids[j],0); addEdge(ids[j],ids[i],0);
  }
}

// The supplied map contains two straight, axis-aligned road endpoint gaps
// of 50 px. Treat only such tiny collinear endpoint gaps as a road join;
// no diagonal/long "shortcut" is ever created.
const endpointNodes=MAP.routing.nodes.filter(n=>{
  const r=roadById.get(String(n.roadId));
  return r && (n.pointIndex===0 || n.pointIndex===r.points.length-1);
});
for(let i=0;i<endpointNodes.length;i++){
  for(let j=i+1;j<endpointNodes.length;j++){
    const a=endpointNodes[i], b=endpointNodes[j];
    const dx=Math.abs(a.x-b.x), dy=Math.abs(a.y-b.y);
    const d=Math.hypot(dx,dy);
    if(d>0 && d<=50 && (dx===0 || dy===0)){
      addEdge(a.id,b.id,d); addEdge(b.id,a.id,d);
    }
  }
}

// Create a virtual graph node exactly at each POI's nearest-road position.
// It is connected only to the two endpoints of that exact road segment,
// so the car cannot cut across buildings or leave the road.
const virtualIds = new Map();
for(const poi of MAP.points){
  const nr=poi.nearestRoad;
  const road=roadById.get(String(nr.roadId));
  if(!road) continue;
  const i=nr.segmentIndex;
  const aNode=MAP.routing.nodes.find(n=>String(n.roadId)===String(nr.roadId)&&n.pointIndex===i);
  const bNode=MAP.routing.nodes.find(n=>String(n.roadId)===String(nr.roadId)&&n.pointIndex===i+1);
  if(!aNode||!bNode) continue;
  const id='poi:'+poi.id;
  virtualIds.set(poi.id,id);
  addNode(id,nr.x,nr.y);
  const a=road.points[i], b=road.points[i+1];
  const segLen=Math.hypot(b.x-a.x,b.y-a.y)||1;
  const da=segLen*(nr.t);
  const db=segLen*(1-nr.t);
  addEdge(id,aNode.id,da); addEdge(aNode.id,id,da);
  addEdge(id,bNode.id,db); addEdge(bNode.id,id,db);
}

// Dijkstra.
function shortestPath(startId,endId){
  if(!graph.has(startId)||!graph.has(endId)) return [];
  const dist=new Map(), prev=new Map(), used=new Set();
  for(const id of graph.keys()) dist.set(id,Infinity);
  dist.set(startId,0);
  while(true){
    let u=null,best=Infinity;
    for(const [id,d] of dist){ if(!used.has(id)&&d<best){best=d;u=id;} }
    if(u===null) break;
    if(u===endId) break;
    used.add(u);
    for(const e of graph.get(u).edges){
      const nd=best+e.w;
      if(nd<dist.get(e.to)){dist.set(e.to,nd);prev.set(e.to,u);}
    }
  }
  if(!prev.has(endId) && startId!==endId) return [];
  const ids=[endId];
  while(ids[0]!==startId) ids.unshift(prev.get(ids[0]));
  return ids.map(id=>graph.get(id));
}

function makeRoute(fromPoi,toPoi){
  const a=virtualIds.get(fromPoi.id), b=virtualIds.get(toPoi.id);
  if(!a||!b) return [];
  return shortestPath(a,b).map(n=>({x:n.x,y:n.y}));
}

// ---------- drawing ----------
function resize(){
  dpr=Math.max(1,Math.min(3,devicePixelRatio||1));
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*dpr); canvas.height=Math.round(H*dpr);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}
function fitMap(){
  const mw=MAP.map.width,mh=MAP.map.height;
  const pad=20;
  const s=Math.min((W-pad*2)/mw,(H-pad*2)/mh);
  view.scale=s;
  view.x=(W-mw*s)/2;
  view.y=(H-mh*s)/2;
}
function worldToScreen(x,y){return {x:x*view.scale+view.x,y:y*view.scale+view.y}}
function screenToWorld(x,y){return {x:(x-view.x)/view.scale,y:(y-view.y)/view.scale}}

function drawRoadOverlay(){
  // Very subtle road centerlines are drawn from the same coordinate data.
  // They are kept faint so the original project artwork remains unchanged.
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  for(const r of MAP.roads){
    ctx.beginPath();
    r.points.forEach((p,i)=>{const q=worldToScreen(p.x,p.y);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});
    ctx.strokeStyle='rgba(255,255,255,.10)';
    ctx.lineWidth=Math.max(1,r.width*view.scale);
    ctx.stroke();
  }
  ctx.restore();
}
function drawPOIs(){
  ctx.save();
  for(const p of MAP.points){
    const q=worldToScreen(p.x,p.y);
    ctx.beginPath();ctx.arc(q.x,q.y,Math.max(3,5*view.scale),0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill();
  }
  ctx.restore();
}
function drawRoute(){
  if(route.length<2)return;
  ctx.save();
  ctx.beginPath();
  route.forEach((p,i)=>{const q=worldToScreen(p.x,p.y);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});
  ctx.strokeStyle='rgba(255,220,70,.8)';
  ctx.lineWidth=Math.max(2,5*view.scale);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  ctx.restore();
}
function drawCar(){
  const q=worldToScreen(car.x,car.y);
  const size=Math.max(12,22*view.scale);
  ctx.save();
  ctx.translate(q.x,q.y);
  ctx.rotate(car.angle);
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=8;
  // Simple car, no external asset needed.
  ctx.fillStyle='#e53935';
  ctx.beginPath();ctx.roundRect(-size*.48,-size*.27,size*.96,size*.54,size*.15);ctx.fill();
  ctx.fillStyle='#222';
  ctx.beginPath();ctx.roundRect(-size*.20,-size*.22,size*.40,size*.20,size*.05);ctx.fill();
  ctx.fillStyle='#111';
  for(const x of [-.30,.30]){
    ctx.beginPath();ctx.arc(x*size,size*.27,size*.10,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(x*size,-size*.27,size*.10,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(view.x,view.y);
  ctx.scale(view.scale,view.scale);
  // draw background in world coordinates
  if(img.complete && img.naturalWidth){
    ctx.drawImage(img,0,0,MAP.map.width,MAP.map.height);
  }else{
    ctx.fillStyle='#202020';ctx.fillRect(0,0,MAP.map.width,MAP.map.height);
  }
  ctx.restore();
  drawRoadOverlay();
  drawRoute();
  drawPOIs();
  drawCar();
}
function zoomAt(factor,sx=W/2,sy=H/2){
  const before=screenToWorld(sx,sy);
  view.scale=Math.max(.08,Math.min(8,view.scale*factor));
  view.x=sx-before.x*view.scale;
  view.y=sy-before.y*view.scale;
  draw();
}

// ---------- movement ----------
function setCarToPoi(poi){
  car.x=poi.nearestRoad.x; car.y=poi.nearestRoad.y;
  car.angle=0; draw();
}
function animateRoute(points, onDone){
  cancelAnimationFrame(animationId);
  if(points.length<2){onDone?.();return}
  moving=true; route=points; routeIndex=0;
  const speed=260; // map pixels / second
  let last=performance.now();
  function frame(now){
    const dt=Math.min(.05,(now-last)/1000); last=now;
    let remain=speed*dt;
    while(remain>0 && routeIndex<route.length-1){
      const a=route[routeIndex], b=route[routeIndex+1];
      const dx=b.x-a.x,dy=b.y-a.y, len=Math.hypot(dx,dy);
      if(len<.0001){routeIndex++;continue}
      const left=len*((car._segT??0)+0); // unused, retained only for clarity
      const curX=car.x,curY=car.y;
      const d=Math.hypot(b.x-curX,b.y-curY);
      const step=Math.min(remain,d);
      const t=step/(d||1);
      car.angle=Math.atan2(b.y-curY,b.x-curX);
      car.x=curX+(b.x-curX)*t; car.y=curY+(b.y-curY)*t;
      remain-=step;
      if(d<=step+.001){car.x=b.x;car.y=b.y;routeIndex++}
    }
    draw();
    if(routeIndex>=route.length-1){
      moving=false; animationId=0; onDone?.(); return;
    }
    animationId=requestAnimationFrame(frame);
  }
  animationId=requestAnimationFrame(frame);
}

// ---------- UI ----------
const station=MAP.points.find(p=>p.name==='Вокзал') || MAP.points[0];
setCarToPoi(station);

for(const poi of MAP.points){
  if(poi.id===station.id) continue;
  const b=document.createElement('button');
  b.textContent='→ '+poi.name;
  b.dataset.id=poi.id;
  b.onclick=()=>{
    if(moving) return;
    const from=MAP.points.find(p=>p.name===activeName) || station;
    const pts=makeRoute(from,poi);
    if(!pts.length){statusEl.textContent='Для этого пункта нет связного маршрута по заданным дорогам.';return}
    activeName=poi.name;
    document.querySelectorAll('#destinations button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    statusEl.textContent='Едем по координатам дорог → '+poi.name;
    animateRoute(pts,()=>{statusEl.textContent='Машина прибыла: '+poi.name+'.'});
  };
  buttonsEl.appendChild(b);
}
document.getElementById('station').onclick=()=>{
  if(moving)return;
  const from=MAP.points.find(p=>p.name===activeName)||station;
  const pts=makeRoute(from,station);
  if(!pts.length){setCarToPoi(station);activeName=station.name;statusEl.textContent='Машина находится на Вокзале.';return}
  animateRoute(pts,()=>{activeName=station.name;statusEl.textContent='Машина вернулась на Вокзал.';});
};
document.getElementById('zoomIn').onclick=()=>zoomAt(1.25);
document.getElementById('zoomOut').onclick=()=>zoomAt(.8);

// ---------- touch / mouse pan + pinch ----------
let pointers=new Map(), panStart=null, pinchStart=null;
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){
    panStart={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};
  }else if(pointers.size===2){
    const a=[...pointers.values()][0],b=[...pointers.values()][1];
    const dx=a.x-b.x,dy=a.y-b.y;
    pinchStart={dist:Math.hypot(dx,dy),scale:view.scale,centerX:(a.x+b.x)/2,centerY:(a.y+b.y)/2,
      world:screenToWorld((a.x+b.x)/2,(a.y+b.y)/2)};
  }
});
canvas.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1 && panStart){
    view.x=panStart.vx+(e.clientX-panStart.x);
    view.y=panStart.vy+(e.clientY-panStart.y);
    draw();
  }else if(pointers.size===2 && pinchStart){
    const a=[...pointers.values()][0],b=[...pointers.values()][1];
    const dx=a.x-b.x,dy=a.y-b.y;
    const dist=Math.hypot(dx,dy);
    view.scale=Math.max(.08,Math.min(8,pinchStart.scale*(dist/pinchStart.dist)));
    view.x=pinchStart.centerX-pinchStart.world.x*view.scale;
    view.y=pinchStart.centerY-pinchStart.world.y*view.scale;
    draw();
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2)pinchStart=null;
  if(pointers.size===1){
    const a=[...pointers.values()][0];
    panStart={x:a.x,y:a.y,vx:view.x,vy:view.y};
  }else panStart=null;
}
canvas.addEventListener('pointerup',endPointer);
canvas.addEventListener('pointercancel',endPointer);
canvas.addEventListener('wheel',e=>{
  e.preventDefault();
  zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY);
},{passive:false});

img.onload=()=>{fitMap();resize();};
addEventListener('resize',resize);

// If image is already cached:

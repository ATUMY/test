</style>

const ROUTE = [{"x":2058.579782612528,"y":545.6605007032199},{"x":1979.7275622093168,"y":638.3580818153863},{"x":1638.6914600131565,"y":1191.5852041039534},{"x":1637.0647677279744,"y":1195.7523614318436},{"x":1680.3345555308508,"y":1250.2313309413275},{"x":1729.9246199829056,"y":1307.142436936674},{"x":1776.5975832957145,"y":1345.569509390837},{"x":1816.9502881514316,"y":1385.942334694699},{"x":1830.5632448803776,"y":1432.6385838787783},{"x":1817.4364898667263,"y":1468.1471362109148},{"x":1802.3649643760702,"y":1499.2780175125326},{"x":1796.0446695348048,"y":1530.408826045803},{"x":1813.5470580652386,"y":1564.4580819327523},{"x":1812.6242046603884,"y":1572.1488460548853},{"x":1776.3682138094505,"y":1601.6215376834334},{"x":1766.4587786515438,"y":1609.651351518085},{"x":1730.1250464074483,"y":1642.476487633169},{"x":1700.8411459878077,"y":1676.115532986421},{"x":1675.0821462614488,"y":1706.7704068018159},{"x":1664.3865363913496,"y":1720.7709564539311},{"x":1650.0036636897366,"y":1710.2024076143393},{"x":1638.0396481747655,"y":1730.2031996021362}];
const STATION = {"x": 2057.84, "y": 544.701, "name": "ВОКЗАЛ"};
const GAS = {"x": 1644.866, "y": 1731.15, "name": "АЗС"};

const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const goBtn = document.getElementById('go');
const resetBtn = document.getElementById('reset');
const statusEl = document.getElementById('status');

const bgImage = new Image();
bgImage.src = BACKGROUND;

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let scale = 1, offsetX = 0, offsetY = 0;
let car = {x:STATION.x, y:STATION.y, angle:0};
let running = false;
let routeIndex = 0;
let segmentT = 0;
let lastTime = 0;

// Скорость в пикселях карты в секунду.
const SPEED = 230;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  fitMap();
  draw();
}

function fitMap() {
  scale = Math.min(innerWidth / MAP_W, innerHeight / MAP_H);
  offsetX = (innerWidth - MAP_W * scale) / 2;
  offsetY = (innerHeight - MAP_H * scale) / 2;
}

function worldToScreen(x,y) {
  return {x: offsetX + x*scale, y: offsetY + y*scale};
}

function drawRoads() {
  ctx.save();
  ctx.translate(offsetX, offsetY);
  ctx.scale(scale, scale);

  // Дороги рисуются, но исходные точки/узлы НЕ рисуются.
  for (const road of ROADS) {
    if (!road.points || road.points.length < 2) continue;
    ctx.beginPath();
    ctx.moveTo(road.points[0].x, road.points[0].y);
    for (let i=1;i<road.points.length;i++) {
      ctx.lineTo(road.points[i].x, road.points[i].y);
    }
    ctx.strokeStyle = road.color || '#fff';
    ctx.lineWidth = road.width || 12;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }
  ctx.restore();
}

function drawPoi(p, color, label) {
  const s = worldToScreen(p.x,p.y);
  ctx.save();
  ctx.beginPath();
  ctx.arc(s.x,s.y,7,0,Math.PI*2);
  ctx.fillStyle = color;
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#fff';
  ctx.stroke();

  ctx.font = '700 14px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = '#fff';
  ctx.shadowColor = 'rgba(0,0,0,.8)';
  ctx.shadowBlur = 5;
  ctx.fillText(label, s.x, s.y-10);
  ctx.restore();
}

function drawCar() {
  const p = worldToScreen(car.x,car.y);
  const size = Math.max(18, 34*scale);

  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(car.angle);

  // Простая SVG-подобная машинка, чтобы index.html был полностью автономным.
  ctx.shadowColor = 'rgba(0,0,0,.55)';
  ctx.shadowBlur = 8;

  ctx.fillStyle = '#e53935';
  ctx.beginPath();
  ctx.roundRect(-size*.62,-size*.36,size*1.24,size*.72,size*.18);
  ctx.fill();

  ctx.fillStyle = '#252525';
  ctx.beginPath();
  ctx.roundRect(-size*.25,-size*.29,size*.50,size*.32,size*.08);
  ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(size*.38,-size*.42,size*.12,0,Math.PI*2);
  ctx.arc(size*.38,size*.42,size*.12,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(-size*.38,-size*.42,size*.12,0,Math.PI*2);
  ctx.arc(-size*.38,size*.42,size*.12,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

function draw() {
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,innerWidth,innerHeight);

  // Фон карты.
  if (bgImage.complete && bgImage.naturalWidth) {
    ctx.drawImage(bgImage, offsetX, offsetY, MAP_W*scale, MAP_H*scale);
  } else {
    ctx.fillStyle = '#1b1b1b';
    ctx.fillRect(0,0,innerWidth,innerHeight);
  }

  drawRoads();

  // Только две контрольные точки — это не точки дорожного графа.
  drawPoi(STATION, '#2ecc71', 'ВОКЗАЛ');
  drawPoi(GAS, '#f1c40f', 'АЗС');

  drawCar();
}

function advance(dt) {
  if (!running) return;

  let remaining = SPEED * dt;

  while (remaining > 0 && routeIndex < ROUTE.length-1) {
    const a = ROUTE[routeIndex];
    const b = ROUTE[routeIndex+1];
    const dx = b.x-a.x, dy = b.y-a.y;
    const len = Math.hypot(dx,dy);

    if (len < 0.001) {
      routeIndex++;
      segmentT = 0;
      continue;
    }

    const available = len * (1-segmentT);

    if (remaining < available) {
      segmentT += remaining/len;
      remaining = 0;
    } else {
      remaining -= available;
      routeIndex++;
      segmentT = 0;
    }
  }

  if (routeIndex >= ROUTE.length-1) {
    car.x = GAS.x;
    car.y = GAS.y;
    running = false;
    statusEl.textContent = 'Машина приехала на АЗС';
    goBtn.textContent = 'В дорогу';
    draw();
    return;
  }

  const a = ROUTE[routeIndex];
  const b = ROUTE[routeIndex+1];
  car.x = a.x + (b.x-a.x)*segmentT;
  car.y = a.y + (b.y-a.y)*segmentT;
  car.angle = Math.atan2(b.y-a.y,b.x-a.x);
}

function frame(t) {
  if (!lastTime) lastTime = t;
  const dt = Math.min((t-lastTime)/1000, .05);
  lastTime = t;
  advance(dt);
  draw();
  requestAnimationFrame(frame);
}

goBtn.addEventListener('click', () => {
  if (routeIndex >= ROUTE.length-1) {
    resetCar();
  }
  running = !running;
  goBtn.textContent = running ? 'Пауза' : 'В дорогу';
  statusEl.textContent = running ? 'Машина едет к АЗС…' : 'Машина на паузе';
});

resetBtn.addEventListener('click', resetCar);

function resetCar() {
  running = false;
  routeIndex = 0;
  segmentT = 0;
  car.x = STATION.x;
  car.y = STATION.y;
  car.angle = Math.atan2(ROUTE[1].y-ROUTE[0].y, ROUTE[1].x-ROUTE[0].x);
  goBtn.textContent = 'В дорогу';
  statusEl.textContent = 'Машина стоит на ВОКЗАЛЕ';
  draw();
}

window.addEventListener('resize', resize);
bgImage.onload = () => { resize(); };
resize();
resetCar();
requestAnimationFrame(frame);
</script>

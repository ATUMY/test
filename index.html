<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes" />
<title>Карта маршрутов — машина по дорогам</title>
<style>
  :root{
    --panel:#101418e0;
    --panel-border:#2b3440;
    --accent:#22c55e;
    --accent-dark:#16a34a;
    --text:#e8eef6;
    --muted:#93a4b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0b0f14;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}

  #stage{position:fixed;inset:0;touch-action:none;cursor:grab;}
  #stage.dragging{cursor:grabbing;}
  #world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform;}

  /* Панель управления */
  #ui{
    position:fixed;left:10px;right:10px;bottom:10px;z-index:20;
    background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--panel-border);border-radius:16px;padding:10px;
    display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 30px #000a;
  }
  #ui.collapsed .row-extra{display:none;}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .row-extra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}

  .btn{
    flex:1 1 auto;min-width:84px;padding:10px 12px;border-radius:12px;border:1px solid var(--panel-border);
    background:#1a2230;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:6px;user-select:none;transition:.15s;
  }
  .btn:active{transform:scale(.97);}
  .btn.on{background:var(--accent);border-color:var(--accent-dark);color:#04140a;}
  .btn.ghost{background:#141b25;}
  .btn.small{flex:0 0 auto;min-width:44px;padding:10px 12px;}

  .field{display:flex;flex-direction:column;gap:4px;flex:1 1 140px;min-width:130px;}
  .field label{font-size:11px;color:var(--muted);letter-spacing:.02em;}
  select,input[type=range]{
    width:100%;padding:9px 10px;border-radius:11px;border:1px solid var(--panel-border);
    background:#1a2230;color:var(--text);font-size:13px;outline:none;
  }
  input[type=range]{padding:0;height:26px;background:transparent;border:none;}

  #hud{
    position:fixed;top:10px;left:10px;right:10px;z-index:20;display:flex;justify-content:space-between;
    gap:8px;pointer-events:none;
  }
  .chip{
    pointer-events:auto;background:var(--panel);border:1px solid var(--panel-border);border-radius:12px;
    padding:8px 11px;font-size:12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    display:flex;align-items:center;gap:8px;
  }
  .chip b{font-weight:700;}
  .muted{color:var(--muted);}
  #compass{width:38px;height:38px;border-radius:50%;border:1px solid var(--panel-border);
    background:radial-gradient(circle at 50% 50%,#1b2430,#0f141b);display:flex;align-items:center;
    justify-content:center;font-size:16px;}
  #compass span{transition:transform .25s linear;display:block;}

  .legend{
    position:fixed;top:64px;left:10px;z-index:19;background:var(--panel);border:1px solid var(--panel-border);
    border-radius:12px;padding:8px 10px;font-size:11px;display:none;backdrop-filter:blur(10px);
  }
  .legend.show{display:block;}
  .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;}
  .legend div{margin:4px 0;color:var(--muted);}

  #toast{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.9);z-index:30;
    background:#0f1620f2;border:1px solid var(--panel-border);border-radius:14px;padding:14px 18px;
    font-size:13px;text-align:center;opacity:0;pointer-events:none;transition:.25s;max-width:80vw;
  }
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .progress{height:5px;border-radius:4px;background:#22303f;overflow:hidden;}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#22c55e,#86efac);transition:width .2s;}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <canvas id="map"></canvas>
    <canvas id="overlay"></canvas>
  </div>
</div>

<div id="hud">
  <div class="chip" id="statusChip">🚗 <b id="status">Ожидание</b></div>
  <div class="chip"><span class="muted">км/ч</span><b id="speedReadout">0</b></div>
  <div class="chip" id="compass"><span id="needle">▲</span></div>
</div>

<div class="legend" id="legend">
  <div><i style="background:#ffffff"></i>Главная дорога (6px)</div>
  <div><i style="background:#ffffff;opacity:.8"></i>Дорога (4px)</div>
  <div><i style="background:#808080"></i>Переулок (2px)</div>
  <div><i style="background:#828282"></i>Второстепенная (2px)</div>
</div>

<div id="ui">
  <div class="row">
    <button class="btn" id="btnRoute">🧭 Маршрут: <b id="routeMode">Короткий</b></button>
    <button class="btn small ghost" id="btnLegend" title="Легенда">ℹ️</button>
    <button class="btn small ghost" id="btnCollapse" title="Свернуть">▾</button>
  </div>

  <div class="row row-extra">
    <div class="field">
      <label for="dest">Метка назначения</label>
      <select id="dest"></select>
    </div>
    <div class="field">
      <label for="speed">Скорость: <b id="speedVal">1.0×</b></label>
      <input type="range" id="speed" min="0.2" max="4" step="0.1" value="1" />
    </div>
  </div>

  <div class="row row-extra">
    <button class="btn on" id="btnGo">▶️ Поехали</button>
    <button class="btn ghost" id="btnPause" disabled>⏸ Пауза</button>
    <button class="btn ghost" id="btnReset">⟲ Сброс</button>
  </div>

  <div class="row row-extra" style="flex-direction:column;align-items:stretch;">
    <div class="progress"><i id="bar"></i></div>
    <div class="muted" style="font-size:11px;" id="progressText">Прогресс: 0%</div>
  </div>
</div>

<div id="toast"></div>

}

let view={scale:1,tx:0,ty:0};

function fitToScreen(){

  const s=Math.min(w/WORLD_W, h/WORLD_H);

let bgImage=null;
function drawBase(){
  mctx.clearRect(0,0,WORLD_W,WORLD_H);

  // фон
  if(bgImage){
    // масштабируем фоновое изображение под границы дорог (грубо) — фон «ложится» на мир
    mctx.drawImage(bgImage, 0, 0, WORLD_W, WORLD_H);
    mctx.fillStyle="rgba(0,0,0,.18)";
    mctx.fillRect(0,0,WORLD_W,WORLD_H);
  } else {
    const g=mctx.createLinearGradient(0,0,WORLD_W,WORLD_H);
    g.addColorStop(0,"#0e1520"); g.addColorStop(1,"#131c28");
    mctx.fillStyle=g; mctx.fillRect(0,0,WORLD_W,WORLD_H);
    // лёгкая «шумовая» сетка
    mctx.strokeStyle="rgba(255,255,255,.03)"; mctx.lineWidth=1;
    for(let x=0;x<WORLD_W;x+=50){mctx.beginPath();mctx.moveTo(x,0);mctx.lineTo(x,WORLD_H);mctx.stroke();}
    for(let y=0;y<WORLD_H;y+=50){mctx.beginPath();mctx.moveTo(0,y);mctx.lineTo(WORLD_W,y);mctx.stroke();}
  }

  // дороги
  mctx.lineCap="round"; mctx.lineJoin="round";
  for(const r of ROADS){
    // тень
    mctx.strokeStyle="rgba(0,0,0,.45)";
    mctx.lineWidth=r.width+2;
    strokePath(r.points);
    // тело
    mctx.strokeStyle=r.color;
    mctx.lineWidth=r.width;
    strokePath(r.points);
    // центральная штрих-линия для широких белых дорог
    if(r.color==="#ffffff" && r.width>=4){
      mctx.strokeStyle="rgba(0,0,0,.22)";
      mctx.lineWidth=Math.max(1, r.width*0.15);
      strokePath(r.points);
    }
  }

  // метки
  for(const L of LABELS){
    mctx.save();
    mctx.translate(L.x,L.y);
    // маячок
    mctx.beginPath(); mctx.arc(0,0,9,0,Math.PI*2);
    mctx.fillStyle="#f59e0b"; mctx.fill();
    mctx.lineWidth=2; mctx.strokeStyle="#0b0f14"; mctx.stroke();
    mctx.beginPath(); mctx.arc(0,0,4,0,Math.PI*2); mctx.fillStyle="#0b0f14"; mctx.fill();
    // подпись
    mctx.font="600 12px -apple-system,Segoe UI,Roboto,Arial";
    const tw=mctx.measureText(L.name).width;
    mctx.fillStyle="rgba(10,14,20,.85)";
    roundRect(mctx, 12, -12, tw+14, 20, 6); mctx.fill();
    mctx.fillStyle="#e8eef6";
    mctx.fillText(L.name, 19, 2);
    mctx.restore();
  }
}
function strokePath(pts){
  mctx.beginPath();
  mctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) mctx.lineTo(pts[i].x,pts[i].y);
  mctx.stroke();
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ============================================================
   ГРАФ ДОРОГ
   ============================================================ */
const NODE_TOL=3;               // допуск склейки вершин
const nodes=[];                 // {x,y}
const adjacency=new Map();      // id -> [{to, dist, roadId}]
function nodeKey(x,y){return `${Math.round(x)},${Math.round(y)}`;}
const nodeIndex=new Map();      // key -> index

function getOrCreateNode(x,y){
  // ищем ближайший узел в пределах допуска
  for(const n of nodes){
    if(Math.abs(n.x-x)<=NODE_TOL && Math.abs(n.y-y)<=NODE_TOL) return n;
  }
  const n={x,y}; nodes.push(n); return n;
}
function addEdge(a,b,roadId){
  const k=nodeIndex.get(nodeKey(a.x,a.y));
  const m=nodeIndex.get(nodeKey(b.x,b.y));
  const d=dist(a,b);
  if(!adjacency.has(k)) adjacency.set(k,[]);
  if(!adjacency.has(m)) adjacency.set(m,[]);
  adjacency.get(k).push({to:m,dist:d,roadId});
  adjacency.get(m).push({to:k,dist:d,roadId});
}
function buildGraph(){
  // создаём узлы
  for(const r of ROADS){
    let prev=null;
    for(const p of r.points){
      const n=getOrCreateNode(p.x,p.y);
      const key=nodeKey(n.x,n.y);
      if(!nodeIndex.has(key)) nodeIndex.set(key, nodeIndex.size);
      if(prev) addEdge(prev,n,r.id);
      prev=n;
    }
  }
}
buildGraph();

/* Проекция произвольной точки на ближайшую дорогу (для старта) */
function projectToRoads(px,py){
  let best=null;
  for(const r of ROADS){
    for(let i=0;i<r.points.length-1;i++){
      const a=r.points[i], b=r.points[i+1];
      const t=Math.max(0, Math.min(1, ((px-a.x)*(b.x-a.x)+(py-a.y)*(b.y-a.y))/((b.x-a.x)**2+(b.y-a.y)**2 || 1)));
      const x=a.x+t*(b.x-a.x), y=a.y+t*(b.y-a.y);
      const d=Math.hypot(px-x,py-y);
      if(!best || d<best.d) best={d,x,y,roadId:r.id};
    }
  }
  return best;
}

/* Дейкстра для поиска двух маршрутов: короткий и длинный */
function nearestNode(x,y){
  let bi=-1, bd=Infinity;
  nodes.forEach((n,i)=>{ const d=dist(n,{x,y}); if(d<bd){bd=d;bi=i;} });
  // найдём ключ для индекса adjacency
  const n=nodes[bi];
  return nodeIndex.get(nodeKey(n.x,n.y));
}
function dijkstra(startIdx, endIdx, mode){
  const N=nodeIndex.size;
  const distArr=new Array(N).fill(Infinity);
  const prev=new Array(N).fill(-1);
  distArr[startIdx]=0;
  const visited=new Array(N).fill(false);
  // простая реализация O(N^2)
  for(let it=0; it<N; it++){
    let u=-1, best=Infinity;
    for(let i=0;i<N;i++) if(!visited[i] && distArr[i]<best){best=distArr[i];u=i;}
    if(u===-1) break;
    visited[u]=true;
    if(u===endIdx) break;
    const edges=adjacency.get(u)||[];
    for(const e of edges){
      // «длинный» режим: увеличиваем вес коротких дорог, чтобы заставить ехать длинным путём
      let w=e.dist;
      if(mode==="long"){
        const r=ROADS.find(x=>x.id===e.roadId);
        const widthFactor = r ? (r.width>=6?0.6 : r.width>=4?1.4 : 2.6) : 1;
        w=e.dist*widthFactor;
      }
      const nd=distArr[u]+w;
      if(nd<distArr[e.to]){distArr[e.to]=nd;prev[e.to]=u;}
    }
  }
  if(distArr[endIdx]===Infinity) return null;
  // восстанавливаем путь по индексам узлов
  const pathIdx=[];
  let cur=endIdx;
  while(cur!==-1){pathIdx.push(cur);cur=prev[cur];}
  pathIdx.reverse();
  // переводим индексы -> узлы -> координаты
  const idxToNode=new Map();
  for(const [k,i] of nodeIndex) idxToNode.set(i, nodes.find(n=>nodeKey(n.x,n.y)===k));
  return pathIdx.map(i=>idxToNode.get(i)).filter(Boolean);
}

const car={x:0,y:0,angle:0,progress:0,path:[],segIndex:0,segT:0,totalLen:0,traveled:0,moving:false,baseSpeed:120};
let routeMode="short";

function setCarAtStart(){
  // старт — левый край главной дороги (25,2125) — «въезд в город»
  const startRoad=ROADS.find(r=>r.id===307);
  const p=startRoad.points[0]; // (1825,750) не то; возьмём конец
  car.x=p.x; car.y=p.y;
}
setCarAtStart();

function buildPath(destLabel){
  const startIdx=nearestNode(car.x,car.y);
  const endIdx=nearestNode(destLabel.x,destLabel.y);
  const path=dijkstra(startIdx,endIdx,routeMode);
  if(!path){ toast("Маршрут не найден"); return null; }
  // добавляем финальный подход к метке (последний сегмент)
  const pts=path.map(n=>({x:n.x,y:n.y}));
  pts.push({x:destLabel.x, y:destLabel.y});
  return pts;
}
function recalcLength(path){
  let L=0;
  for(let i=0;i<path.length-1;i++) L+=dist(path[i],path[i+1]);
  return L;
}
function setPath(path){
  car.path=path; car.segIndex=0; car.segT=0; car.traveled=0;
  car.totalLen=recalcLength(path);
  if(path.length){
    car.x=path[0].x; car.y=path[0].y;
    car.angle=Math.atan2(path[1].y-path[0].y, path[1].x-path[0].x);
  }
}
function moveCar(dt){
  if(!car.moving || car.path.length<2) return;
  const speed=car.baseSpeed*(parseFloat($("#speed").value));
  let remain=speed*dt;
  while(remain>0 && car.segIndex<car.path.length-1){
    const a=car.path[car.segIndex], b=car.path[car.segIndex+1];
    const segLen=dist(a,b);
    const gone=car.segT*segLen;
    const leftInSeg=segLen-gone;
    if(remain<leftInSeg){
      car.segT += remain/segLen;
      car.traveled += remain;
      remain=0;
      car.x=a.x+(b.x-a.x)*car.segT;
      car.y=a.y+(b.y-a.y)*car.segT;
      car.angle=Math.atan2(b.y-a.y, b.x-a.x);
    } else {
      remain-=leftInSeg;
      car.traveled += leftInSeg;
      car.segIndex++;
      car.segT=0;
      if(car.segIndex>=car.path.length-1){
        car.moving=false;
        car.x=car.path[car.path.length-1].x;
        car.y=car.path[car.path.length-1].y;
        toast("✅ Прибыли на место!");
        $("#status").textContent="Прибытие";
        $("#btnPause").disabled=true;
        $("#btnGo").classList.add("on");
        break;
      }
    }
  }
  const pct=car.totalLen?Math.min(100, (car.traveled/car.totalLen)*100):0;
  car.progress=pct;
  $("#bar").style.width=pct+"%";
  $("#progressText").textContent=`Прогресс: ${pct.toFixed(1)}%  •  ${(car.traveled/10).toFixed(0)} м / ${(car.totalLen/10).toFixed(0)} м`;
  $("#speedReadout").textContent=(speed/2).toFixed(0); // псевдо-км/ч
}

/* ============================================================
   ОТРИСОВКА OVERLAY (машина + маршрут)
   ============================================================ */
function drawOverlay(){
  octx.clearRect(0,0,WORLD_W,WORLD_H);

  // маршрут (подсветка)
  if(car.path.length>1){
    octx.lineCap="round"; octx.lineJoin="round";
    octx.strokeStyle="rgba(34,197,94,.35)";
    octx.lineWidth=10;
    octx.beginPath();
    octx.moveTo(car.path[0].x, car.path[0].y);
    for(let i=1;i<car.path.length;i++) octx.lineTo(car.path[i].x, car.path[i].y);
    octx.stroke();

    octx.strokeStyle="#22c55e";
    octx.lineWidth=3;
    octx.setLineDash([10,10]);
    octx.beginPath();
    octx.moveTo(car.path[0].x, car.path[0].y);
    for(let i=1;i<car.path.length;i++) octx.lineTo(car.path[i].x, car.path[i].y);
    octx.stroke();
    octx.setLineDash([]);

    // пройденная часть — ярче
    octx.strokeStyle="#86efac";
    octx.lineWidth=4;
    octx.beginPath();
    let acc=0;
    octx.moveTo(car.path[0].x, car.path[0].y);
    for(let i=0;i<car.path.length-1;i++){
      const a=car.path[i], b=car.path[i+1];
      const segLen=dist(a,b);
      if(acc+segLen<=car.traveled){
        octx.lineTo(b.x,b.y); acc+=segLen;
      } else {
        const t=(car.traveled-acc)/segLen;
        octx.lineTo(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t);
        break;
      }
    }
    octx.stroke();
  }

  // машина — зелёная галочка
  octx.save();
  octx.translate(car.x, car.y);
  octx.rotate(car.angle);
  // свечение
  octx.beginPath(); octx.arc(0,0,20,0,Math.PI*2);
  octx.fillStyle="rgba(34,197,94,.18)"; octx.fill();
  // корпус
  octx.beginPath();
  octx.moveTo(16,0);
  octx.lineTo(-10,10);
  octx.lineTo(-5,0);
  octx.lineTo(-10,-10);
  octx.closePath();
  octx.fillStyle="#22c55e";
  octx.fill();
  octx.lineWidth=2; octx.strokeStyle="#0b0f14"; octx.stroke();
  // «галочка» внутри
  octx.beginPath();
  octx.moveTo(-2,-1); octx.lineTo(2,4); octx.lineTo(9,-5);
  octx.lineWidth=2.6; octx.strokeStyle="#04140a"; octx.lineCap="round"; octx.lineJoin="round";
  octx.stroke();
  octx.restore();

  // указатели меток-подсказок на финиш
  if(car.path.length>1 && car.moving){
    const target=car.path[car.path.length-1];
    const screenPos=toScreen(target.x,target.y);
    if(screenPos.x<0||screenPos.y<0||screenPos.x>stage.clientWidth||screenPos.y>stage.clientHeight){
      // стрелка к цели, если цель вне экрана
      const cx=stage.clientWidth/2, cy=stage.clientHeight/2;
      const ang=Math.atan2(screenPos.y-cy, screenPos.x-cx);
      const rx=Math.min(stage.clientWidth,stage.clientHeight)*0.4;
      const px=cx+Math.cos(ang)*rx, py=cy+Math.sin(ang)*rx;
      octx.save();
      // рисуем в экранных координатах через отдельный проход ниже
      octx.restore();
      drawOffscreenMarker(px,py,ang);
    }
  }
}
function toScreen(wx,wy){
  // мировые координаты внутри world; world смещён через CSS-трансформ, поэтому для экранных расчётов используем view
  return {x: wx*view.scale+view.tx, y: wy*view.scale+view.ty};
}
function drawOffscreenMarker(px,py,ang){
  octx.save();
  // рисуем в мировых координатах через обратное преобразование
  const wx=(px-view.tx)/view.scale;
  const wy=(py-view.ty)/view.scale;
  octx.translate(wx,wy);
  octx.rotate(ang);
  octx.beginPath();
  octx.moveTo(14,0); octx.lineTo(-8,8); octx.lineTo(-8,-8); octx.closePath();
  octx.fillStyle="#22c55e"; octx.fill();
  octx.lineWidth=2; octx.strokeStyle="#0b0f14"; octx.stroke();
  octx.restore();
}

/* ============================================================
   ЦИКЛ АНИМАЦИИ
   ============================================================ */
let last=performance.now();
function loop(t){
  const dt=Math.min(0.05,(t-last)/1000); last=t;
  moveCar(dt);
  drawOverlay();
  // стрелка компаса
  const deg=(car.angle*180/Math.PI+90);
  $("#needle").style.transform=`rotate(${deg}deg)`;
  requestAnimationFrame(loop);
}

/* ============================================================
   ПАНЫ И ЗУМЫ (тач + мышь)
   ============================================================ */
let pointers=new Map();
let lastPan=null, pinchStart=null;

stage.addEventListener("pointerdown", e=>{
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===1){ lastPan={x:e.clientX,y:e.clientY}; stage.classList.add("dragging"); }
  if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinchStart={d:Math.hypot(a.x-b.x,a.y-b.y), scale:view.scale};
  }
});
stage.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(pointers.size===1 && lastPan){
    const dx=e.clientX-lastPan.x, dy=e.clientY-lastPan.y;
    view.tx+=dx; view.ty+=dy;
    lastPan={x:e.clientX,y:e.clientY};
    applyView();
  } else if(pointers.size===2 && pinchStart){
    const [a,b]=[...pointers.values()];
    const d=Math.hypot(a.x-b.x,a.y-b.y);
    const factor=d/pinchStart.d;
    const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2;
    const newScale=Math.max(0.15,Math.min(6, pinchStart.scale*factor));
    // зум вокруг центра пинча
    const k=newScale/view.scale;
    view.tx = cx - (cx-view.tx)*k;
    view.ty = cy - (cy-view.ty)*k;
    view.scale=newScale;
    applyView();
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size===0){ lastPan=null; stage.classList.remove("dragging"); }
  if(pointers.size<2) pinchStart=null;
}
stage.addEventListener("pointerup", endPointer);
stage.addEventListener("pointercancel", endPointer);

// колесо мыши
stage.addEventListener("wheel", e=>{
  e.preventDefault();
  const factor=e.deltaY<0?1.1:0.9;
  const cx=e.clientX, cy=e.clientY;
  const k=factor;
  view.tx = cx - (cx-view.tx)*k;
  view.ty = cy - (cy-view.ty)*k;
  view.scale=Math.max(0.15,Math.min(6, view.scale*k));
  applyView();
},{passive:false});

// двойной тап = зум
let lastTap=0;
stage.addEventListener("pointerup", e=>{
  const now=Date.now();
  if(now-lastTap<280){
    const k=1.6, cx=e.clientX, cy=e.clientY;
    view.tx=cx-(cx-view.tx)*k; view.ty=cy-(cy-view.ty)*k;
    view.scale=Math.min(6,view.scale*k);
    applyView();
  }
  lastTap=now;
});

/* ============================================================
   UI
   ============================================================ */
function fillDestinations(){
  const sel=$("#dest");
  sel.innerHTML="";
  for(const L of LABELS){
    const o=document.createElement("option");
    o.value=L.id; o.textContent=L.name;
    sel.appendChild(o);
  }
}
fillDestinations();

$("#speed").addEventListener("input", e=>{
  $("#speedVal").textContent=parseFloat(e.target.value).toFixed(1)+"×";
});
$("#btnRoute").addEventListener("click", ()=>{
  routeMode = routeMode==="short" ? "long" : "short";
  $("#routeMode").textContent = routeMode==="short" ? "Короткий" : "Длинный";
  toast(routeMode==="short" ? "Короткий маршрут" : "Длинный маршрут");
});
$("#btnLegend").addEventListener("click", ()=>$("#legend").classList.toggle("show"));
$("#btnCollapse").addEventListener("click", ()=>{
  const ui=$("#ui"); ui.classList.toggle("collapsed");
  $("#btnCollapse").textContent = ui.classList.contains("collapsed") ? "▴" : "▾";
});
$("#btnGo").addEventListener("click", ()=>{
  const destId=parseInt($("#dest").value,10);
  const destLabel=LABELS.find(L=>L.id===destId);
  if(!destLabel){ toast("Выберите метку"); return; }
  const path=buildPath(destLabel);
  if(!path) return;
  setPath(path);
  car.moving=true;
  $("#status").textContent="В пути → "+destLabel.name;
  $("#btnPause").disabled=false;
  $("#btnGo").classList.remove("on");
  toast("Поехали!");
});
$("#btnPause").addEventListener("click", ()=>{
  car.moving=!car.moving;
  $("#btnPause").textContent = car.moving ? "⏸ Пауза" : "▶️ Продолжить";
  $("#status").textContent = car.moving ? "В пути" : "Пауза";
});
$("#btnReset").addEventListener("click", ()=>{
  car.path=[]; car.moving=false; car.traveled=0; car.progress=0;
  $("#bar").style.width="0%";
  $("#progressText").textContent="Прогресс: 0%";
  $("#status").textContent="Ожидание";
  $("#btnPause").disabled=true; $("#btnPause").textContent="⏸ Пауза";
  $("#btnGo").classList.add("on");
  setCarAtStart();
  drawOverlay();
});

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================ */
function boot(){
  if(BG_IMAGE_DATA_URL && BG_IMAGE_DATA_URL.startsWith("data:image")){
    const img=new Image();
    img.onload=()=>{ bgImage=img; drawBase(); };
    img.onerror=()=>{ bgImage=null; drawBase(); toast("Не удалось загрузить фон"); };
    img.src=BG_IMAGE_DATA_URL;
  } else {
    drawBase();
  }
  fitToScreen();
  requestAnimationFrame(loop);
  // авто-размер при повороте
  window.addEventListener("resize", ()=>{ /* сохраняем масштаб/позицию, но подгоняем если карта выпала */ fitToScreen(); });
}
boot();
</script>
